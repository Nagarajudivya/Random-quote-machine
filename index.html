<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Quote Machine</title>

    <!-- React 17 -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>

    <!-- React DOM 17 -->
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- CSS -->
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        #quote-box {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        #text {
            font-size: 25px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
        }

        #author {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        #new-quote,
        #tweet-quote {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        #new-quote:hover,
        #tweet-quote:hover {
            background: #4c51bf;
        }

        @media (max-width: 500px) {

            #quote-box {
                padding: 25px 18px;
            }

            #text {
                font-size: 21px;
            }

        }

    </style>

</head>

<body>

<!-- React will display the application inside this div -->
<div id="root"></div>


<!-- React application code -->
<script type="text/babel">

    // STEP 1: Store quotes in an array

    const quotes = [

        {
            text: "The future depends on what you do today.",
            author: "Mahatma Gandhi"
        },

        {
            text: "It always seems impossible until it's done.",
            author: "Nelson Mandela"
        },

        {
            text: "Believe you can and you're halfway there.",
            author: "Theodore Roosevelt"
        },

        {
            text: "The only way to do great work is to love what you do.",
            author: "Steve Jobs"
        },

        {
            text: "Success is not final, failure is not fatal.",
            author: "Winston Churchill"
        },

        {
            text: "Dream big and dare to fail.",
            author: "Norman Vaughan"
        },

        {
            text: "In the middle of difficulty lies opportunity.",
            author: "Albert Einstein"
        },

        {
            text: "Do what you can, with what you have, where you are.",
            author: "Theodore Roosevelt"
        },

        {
            text: "The secret of getting ahead is getting started.",
            author: "Mark Twain"
        },

        {
            text: "Great things are done by a series of small things brought together.",
            author: "Vincent van Gogh"
        }

    ];


    // STEP 2: Create React component

    function QuoteMachine() {


        // STEP 3: Select a random quote when application starts

        const [quote, setQuote] = React.useState(

            quotes[Math.floor(Math.random() * quotes.length)]

        );


        // STEP 4: Function to generate a new quote

        function handleNewQuote() {

            let newQuote;

            do {

                const randomIndex = Math.floor(
                    Math.random() * quotes.length
                );

                newQuote = quotes[randomIndex];

            } while (newQuote === quote);


            // Update React state

            setQuote(newQuote);

        }


        // STEP 5: Create Twitter URL

        const tweetUrl =
            "https://twitter.com/intent/tweet?text=" +
            encodeURIComponent(
                '"' + quote.text + '" - ' + quote.author
            );


        // STEP 6: Display application

        return (

            <div id="quote-box">

                <h1>Random Quote Machine</h1>

                <p id="text">
                    {quote.text}
                </p>

                <p id="author">
                    - {quote.author}
                </p>

                <div className="buttons">

                    <button
                        id="new-quote"
                        onClick={handleNewQuote}
                    >
                        New Quote
                    </button>


                    <a
                        id="tweet-quote"
                        href={tweetUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Tweet Quote
                    </a>

                </div>

            </div>

        );

    }


    // STEP 7: Display React component in browser

    ReactDOM.render(

        <QuoteMachine />,

        document.getElementById("root")

    );

</script>


<!-- FreeCodeCamp test suite -->
<script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>

</body>

</html>
